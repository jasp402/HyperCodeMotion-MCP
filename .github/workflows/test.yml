name: Validate MCP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test

  production-smoke:
    name: Production Smoke Test
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify public MCP over HTTPS
        env:
          MCP_URL: https://mcp.hypercodemotion.com/mcp
        run: |
          # Vercel deploys asynchronously after push; allow time for the endpoint to become ready.
          for attempt in $(seq 1 12); do
            echo "Production MCP check $attempt/12"
            if npm run test:live; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 15; fi
          done
          echo "Public MCP endpoint failed the smoke test"
          exit 1
