name: Publish to Smithery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish remote MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test MCP
        run: npm test
      - name: Smoke test remote endpoint
        run: npm run test:live
      - name: Check Smithery authentication
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "::error::Set repository secret SMITHERY_API_KEY before publishing."
            exit 1
          fi
      - name: Publish server to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          npx --yes smithery@latest mcp publish https://mcp.hypercodemotion.com/mcp -n jasp402/hypercodemotion-mcp
