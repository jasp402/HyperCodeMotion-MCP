name: Verify Skills.sh Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skills/hypercodemotion/**'
      - '.github/workflows/verify-skills.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run skill and MCP tests
        run: npm test
      - name: Verify skills CLI discovers HyperCodeMotion
        run: |
          set -euo pipefail
          npx --yes skills@latest add jasp402/HyperCodeMotion-MCP --list 2>&1 | tee skills-discovery.log
          grep -qi 'hypercodemotion' skills-discovery.log
